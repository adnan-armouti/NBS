# Conda environment for mm3DPS.
#
# Tested with Python 3.12 + CUDA 11.8 on NVIDIA RTX 4090. The torch
# wheel pin is for cu118; switch the --extra-index-url under pip: to the
# cu121 (or matching) wheel index for CUDA 12.x.

name: mm3DPS
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.7.1+cu118
      - mitsuba==3.7.1
      - drjit==1.2.0
      - numpy==1.26.0
      - scipy==1.16.1
      - scikit-image==0.25.2
      - matplotlib==3.10.5
      - trimesh==4.7.4
      - open3d==0.19.0
      - plyfile==1.1.3
      - imageio==2.37.0
      - imageio-ffmpeg==0.6.0
      - Pillow==11.3.0
      - PyYAML==6.0.2
      - h5py==3.15.1
      - tqdm==4.67.1
      - pytest==8.4.2
      # ColoRadar -> data/ preprocessing pipeline (optional)
      - faiss-cpu==1.8.0
      - ipywidgets==8.1.5
